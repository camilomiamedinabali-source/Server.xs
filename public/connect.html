<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect to Remote Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .status-icon {
            font-size: 60px;
            margin: 20px 0;
        }

        .status-text {
            font-size: 16px;
            color: #555;
            margin: 20px 0;
            line-height: 1.6;
        }

        .status-text.connecting {
            color: #667eea;
            font-weight: 600;
        }

        .status-text.connected {
            color: #2ecc71;
            font-weight: 600;
        }

        .status-text.error {
            color: #e74c3c;
            font-weight: 600;
        }

        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .input-group {
            margin: 20px 0;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 30px;
        }

        .control-btn {
            padding: 20px;
            background: #f0f7ff;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .control-btn:active {
            background: #e0efff;
            transform: scale(0.95);
        }

        .mouse-pad {
            width: 100%;
            height: 200px;
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-top: 20px;
            cursor: crosshair;
            position: relative;
            touch-action: none;
        }

        .position-display {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .controls {
                grid-template-columns: 1fr 1fr 1fr;
            }

            .control-btn {
                padding: 15px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Remote Control</h1>
        <p class="subtitle">Phone Client</p>

        <div id="connectingView">
            <div class="status-icon">📱</div>
            <div class="loader"></div>
            <div class="status-text connecting" id="statusText">Connecting to server...</div>

            <div class="input-group hidden" id="manualInput">
                <p style="text-align: left; color: #666; margin-bottom: 10px; font-size: 13px;">
                    Or enter server address manually:
                </p>
                <input type="text" id="serverUrl" placeholder="ws://192.168.1.100:8080" />
                <button onclick="connectManual()">Connect</button>
            </div>
        </div>

        <div id="controlView" class="hidden">
            <div class="status-icon">✅</div>
            <div class="status-text connected">Connected to Desktop</div>

            <div class="controls">
                <button class="control-btn" onclick="sendCommand('key-press', {key: 'ArrowUp'})">⬆️</button>
                <button class="control-btn" onclick="sendCommand('click', {button: 'left'})">🖱️</button>
                <button class="control-btn" onclick="sendCommand('key-press', {key: 'ArrowDown'})">⬇️</button>
                <button class="control-btn" onclick="sendCommand('key-press', {key: 'ArrowLeft'})">⬅️</button>
                <button class="control-btn" onclick="sendCommand('key-press', {key: 'Escape'})">❌</button>
                <button class="control-btn" onclick="sendCommand('key-press', {key: 'ArrowRight'})">➡️</button>
            </div>

            <div class="mouse-pad" id="mousePad" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event)">
                <div class="position-display" id="positionDisplay">Drag to control mouse</div>
            </div>

            <button onclick="disconnect()" style="margin-top: 20px; background: #e74c3c;">Disconnect</button>
        </div>

        <div id="errorView" class="hidden">
            <div class="status-icon">⚠️</div>
            <div class="status-text error" id="errorText">Connection failed</div>
            <button onclick="location.reload()">Retry</button>
        </div>
    </div>

    <script>
        let ws = null;
        let clientId = null;
        const urlParams = new URLSearchParams(window.location.search);
        const initialUrl = urlParams.get('server') || urlParams.get('ws');

        class PhoneRemoteClient {
            constructor(serverUrl) {
                this.serverUrl = serverUrl;
                this.ws = null;
                this.clientId = null;
            }

            connect() {
                return new Promise((resolve, reject) => {
                    try {
                        this.ws = new WebSocket(this.serverUrl);

                        this.ws.onopen = () => {
                            this.ws.send(JSON.stringify({
                                type: 'register',
                                deviceType: 'phone'
                            }));
                        };

                        this.ws.onmessage = (event) => {
                            const data = JSON.parse(event.data);
                            if (data.type === 'registered') {
                                this.clientId = data.clientId;
                                resolve(this.clientId);
                            }
                        };

                        this.ws.onerror = (error) => {
                            reject(new Error('Connection failed: ' + error));
                        };

                        this.ws.onclose = () => {
                            document.getElementById('connectingView').classList.add('hidden');
                            document.getElementById('controlView').classList.add('hidden');
                            document.getElementById('errorView').classList.remove('hidden');
                        };
                    } catch (error) {
                        reject(error);
                    }
                });
            }

            sendCommand(command, payload) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        type: 'command',
                        command,
                        payload
                    }));
                }
            }

            disconnect() {
                if (this.ws) {
                    this.ws.close();
                }
            }
        }

        function getServerUrl() {
            if (initialUrl) {
                // Parse QR code URL or manual entry
                if (initialUrl.startsWith('ws://') || initialUrl.startsWith('wss://')) {
                    return initialUrl;
                }
            }
            // Default to current host
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${protocol}//${window.location.host}`;
        }

        async function initializeConnection() {
            const serverUrl = getServerUrl();
            const client = new PhoneRemoteClient(serverUrl);

            try {
                await client.connect();
                ws = client.ws;
                clientId = client.clientId;

                document.getElementById('connectingView').classList.add('hidden');
                document.getElementById('errorView').classList.add('hidden');
                document.getElementById('controlView').classList.remove('hidden');
            } catch (error) {
                console.error('Connection error:', error);
                document.getElementById('statusText').textContent = 'Server not found. Enter address manually:';
                document.getElementById('manualInput').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('connectingView').classList.add('hidden');
                    document.getElementById('errorView').classList.remove('hidden');
                    document.getElementById('errorText').textContent = error.message;
                }, 3000);
            }
        }

        function sendCommand(command, payload) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'command',
                    command,
                    payload
                }));
            }
        }

        function handleTouchStart(e) {
            const rect = e.target.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;
            updateMousePadDisplay(x, y);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const rect = e.target.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            const y = e.touches[0].clientY - rect.top;
            updateMousePadDisplay(x, y);
            sendCommand('mouse-move', { x: Math.round(x), y: Math.round(y) });
        }

        function updateMousePadDisplay(x, y) {
            document.getElementById('positionDisplay').textContent = `X: ${Math.round(x)} Y: ${Math.round(y)}`;
        }

        function connectManual() {
            const url = document.getElementById('serverUrl').value.trim();
            if (url) {
                window.location.search = '?server=' + encodeURIComponent(url);
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
            }
            location.reload();
        }

        // Initialize on page load
        window.addEventListener('load', initializeConnection);
    </script>
</body>
</html>
